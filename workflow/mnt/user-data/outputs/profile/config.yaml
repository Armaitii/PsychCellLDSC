# Usage: snakemake --profile profile
# Encodes the concurrency fix from our manual run: cap jobs (-j) rather than
# letting numpy/BLAS spawn threads per job, which caused severe contention
# on a 6-core/12-thread machine with only ~6GB RAM available.

jobs: 4
keep-going: true
rerun-incomplete: true
printshellcmds: true

# Force single-threaded BLAS for every shell rule (equivalent to the
# `export OMP_NUM_THREADS=1` etc. we used manually before `parallel`).
